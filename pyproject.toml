[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minipresidente"
version = "0.1.0"
description = "Compartilhamento de tela peer-to-peer para LAN/VPN"
requires-python = ">=3.10"
license = {text = "MIT"}  # PEP 639 string form requires setuptools>=77; text form works broadly
dependencies = [
    "PySide6>=6.5",
    "mss>=9.0",
    "Pillow>=10.0",
    "packaging>=23.0",
]

[project.scripts]
minipresidente = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
