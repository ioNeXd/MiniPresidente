[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minipresidente"
dynamic = ["version"]
description = "Compartilhamento de tela peer-to-peer para LAN/VPN"
requires-python = ">=3.10"
license = "MIT"  # A forma SPDX exige setuptools>=77.0.3
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.5",
    "mss>=9.0",
    "Pillow>=10.0",
    "packaging>=23.0",
]

[project.scripts]
minipresidente = "app.main:main"

[tool.setuptools.dynamic]
version = {attr = "app.config.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
